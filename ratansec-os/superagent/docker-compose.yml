# RatanSec Super Agent v2 — private console + bounded probes
#   cp superagent/.env.example .env   # edit locally; never commit
#   docker compose -f superagent/docker-compose.yml up -d --build
services:
  superagent:
    build:
      context: ..
      dockerfile: superagent/Dockerfile.slim
    image: ratansec-superagent:2.0
    container_name: superagent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # put HTTPS reverse proxy in front for remote access
    env_file:
      - ../.env
    environment:
      SUPERAGENT_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - superagent-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  superagent-data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect — RatanSec Super Agent</title>
<link rel="stylesheet" href="./app.css">
<style>body{display:grid;place-items:center;min-height:100vh;padding:20px}.connect-card{width:min(460px,100%)}</style>
</head>
<body>
<div class="card connect-card">
  <div class="logo-big">🛡️</div>
  <h1>RatanSec <span class="ok">Super Agent</span></h1>
  <p class="muted">Apne self-hosted server ka URL daalo. Login agle screen par hoga — token URL mein nahi bheja jata.</p>
  <label class="field"><span>Server URL</span><input id="server" placeholder="https://agent.example.com" inputmode="url" autocapitalize="off"></label>
  <button class="btn primary wide" id="connect">Open console</button>
  <p class="hint" id="status"></p>
</div>
<script src="./connect.js"></script>
</body>
</html>

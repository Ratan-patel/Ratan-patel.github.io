plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.Ratanpatel.sentinel'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.Ratanpatel.sentinel'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Deliberately no third-party dependencies: plain Android framework only.
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Security Lab & CTF Simulator | Ratan Kumar Patel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: monospace; }
    .terminal-window { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid #1e293b; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-teal-400">⚡ Ratan AI Security Lab & CTF Console</h1>
      <a href="index.html" class="text-gray-400 hover:text-white">← Back to Hub</a>
    </div>

    <div class="terminal-window rounded-xl p-6 shadow-2xl">
      <div class="flex items-center gap-2 mb-4 pb-2 border-b border-gray-800">
        <span class="w-3 h-3 rounded-full bg-red-500"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
        <span class="w-3 h-3 rounded-full bg-green-500"></span>
        <span class="text-xs text-gray-500 ml-2">sandbox@ratan-security-node:~$</span>
      </div>

      <div id="output" class="h-80 overflow-y-auto mb-4 space-y-2 text-sm text-green-400">
        <div>[System] Ratan OS v2.0 Kernel Connected. Type <span class="text-yellow-400">'help'</span> for available simulations.</div>
      </div>

      <div class="flex items-center gap-2 bg-slate-900 p-2 rounded border border-slate-700">
        <span class="text-teal-400 font-bold">&gt;</span>
        <input id="command-input" type="text" class="w-full bg-transparent outline-none text-white font-mono" placeholder="nmap -sV target, scan headers, audit-llm, help..." autofocus>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('command-input');
    const output = document.getElementById('output');

    const commands = {
      'help': "Available commands:\n- scan headers : Runs non-destructive HTTP header security audit\n- nmap -sV target : Simulates network port and service discovery\n- audit-llm : Runs AI Autoclave Prompt-Injection defense simulation\n- ctf flag1 : Validates Challenge #1 flag\n- clear : Clears terminal window",
      'scan headers': "[+] Connecting to ratan-patel.github.io...\n[+] TLS 1.3 Handshake: Valid (ECDSA)\n[+] HSTS: Active (max-age=31536000)\n[+] Grade: A+ Security Posture Verified.",
      'nmap -sV target': "[+] Port 80/tcp  OPEN  http (Nginx/1.24)\n[+] Port 443/tcp OPEN  https (Cloudflare Edge)\n[+] Host Security: Hardened (0 open high-risk ports)",
      'audit-llm': "[*] Injecting test pattern: 'ignore previous instructions'\n[!] 0x Alpha Intercept: Pattern Matched.\n[+] Verdict: Quarantined & Blocked in 2.1ms.",
      'ctf flag1': "[+] Verification SUCCESS! Flag {RATAN_CYBER_DEFENSE_2026} accepted."
    };

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const cmd = input.value.trim();
        output.innerHTML += `<div class="text-gray-300">&gt; ${cmd}</div>`;
        if (cmd === 'clear') {
          output.innerHTML = '';
        } else if (commands[cmd]) {
          output.innerHTML += `<div class="text-teal-300 whitespace-pre-wrap">${commands[cmd]}</div>`;
        } else {
          output.innerHTML += `<div class="text-red-400">Command not recognized. Type 'help' for options.</div>`;
        }
        input.value = '';
        output.scrollTop = output.scrollHeight;
      }
    });
  </script>
</body>
</html>

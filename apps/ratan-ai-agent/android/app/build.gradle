plugins {
    id 'com.android.application'
}

// A release keystore is supplied by CI as a path; without one the build falls back to the
// debug key so that `gradle :app:assembleRelease` still produces something installable.
def keystorePath = System.getenv("RATAN_KEYSTORE_PATH")

// Android 17 (API 37) is the target; CI may pass a lower level if the runner's SDK channel
// does not offer 37 yet, and the build must still produce an installable APK.
def compileSdkLevel = Integer.parseInt(System.getenv("RATAN_COMPILE_SDK") ?: "37")
def targetSdkLevel = Integer.parseInt(System.getenv("RATAN_TARGET_SDK") ?: String.valueOf(compileSdkLevel))

android {
    namespace = 'io.github.ratanpatel.ratanagent'
    compileSdk = compileSdkLevel

    defaultConfig {
        applicationId = "io.github.ratanpatel.ratanagent"
        minSdk = 24                      // Android 7.0 and newer
        targetSdk = targetSdkLevel
        versionCode = 210
        versionName = "2.1.0"

        buildConfigField "int", "COMPILE_SDK", String.valueOf(compileSdkLevel)
        buildConfigField "String", "AGENT_URL", "\"https://v1qmk5wx2361-d.space-z.ai/\""
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (keystorePath) {
            create("agentRelease") {
                storeFile = file(keystorePath)
                storePassword = System.getenv("RATAN_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("RATAN_KEY_ALIAS") ?: "ratan-agent"
                keyPassword = System.getenv("RATAN_KEY_PASSWORD")
                storeType = "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            // R8 stays off on purpose: a WebView shell is dominated by framework callbacks and
            // the JavaScript bridge, and an obfuscated bridge is a support ticket, not a feature.
            // Enable it for a Play build and re-test getUserMedia + the bridge on a device.
            minifyEnabled = false
            shrinkResources = false
            signingConfig = keystorePath
                    ? signingConfigs.getByName("agentRelease")
                    : signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Framework-only by design: no Play Services, no analytics, no third-party runtime.
}

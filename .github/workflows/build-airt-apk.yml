name: Build AIRT Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "tools/ai-redteam-scanner/android/**"
      - "tools/ai-redteam-scanner/js/**"
      - "tools/ai-redteam-scanner/airt/payloads.py"
      - "tools/ai-redteam-scanner/mobile.template.html"
      - "tools/ai-redteam-scanner/gen_mobile.py"
      - ".github/workflows/build-airt-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licences and install the platform we compile against
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Regenerate the bundled scanner page from the Python corpus
        run: python3 tools/ai-redteam-scanner/gen_mobile.py

      - name: Verify the JS engine before packaging
        run: node tools/ai-redteam-scanner/tests/engine_js_test.js

      - name: Build debug and release APKs
        working-directory: tools/ai-redteam-scanner/android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts with friendly names
        run: |
          set -e
          mkdir -p out
          cp tools/ai-redteam-scanner/android/app/build/outputs/apk/debug/app-debug.apk \
             out/AIRT-Scanner-1.0.0-debug.apk
          cp tools/ai-redteam-scanner/android/app/build/outputs/apk/release/app-release.apk \
             out/AIRT-Scanner-1.0.0-release.apk
          ls -lh out

      - name: Show APK contents (sanity check)
        run: |
          unzip -l out/AIRT-Scanner-1.0.0-release.apk | head -25
          unzip -l out/AIRT-Scanner-1.0.0-release.apk | grep -c "assets/index.html"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: airt-scanner-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

name: Build AIRT Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "tools/ai-redteam-scanner/android/**"
      - "tools/ai-redteam-scanner/js/**"
      - "tools/ai-redteam-scanner/airt/payloads.py"
      - "tools/ai-redteam-scanner/mobile.template.html"
      - "tools/ai-redteam-scanner/gen_mobile.py"
      - ".github/workflows/build-airt-apk.yml"

permissions:
  contents: read

env:
  PROJECT_DIR: tools/ai-redteam-scanner/android

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and prepare the Android SDK
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true

          CMDLINE=""
          for candidate in "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/bin" "$SDK/tools/bin"; do
            if [ -x "$candidate/sdkmanager" ]; then CMDLINE="$candidate"; break; fi
          done
          echo "cmdline tools: ${CMDLINE:-<none found>}"

          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$CMDLINE/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" \
              > /dev/null 2>&1 || echo "warning: could not install SDK packages (they are likely preinstalled)"
            echo "$CMDLINE" >> "$GITHUB_PATH"
          fi

          echo "ANDROID_HOME=$SDK"   >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"

          # what do we actually have?
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
        env:
          PROJECT_DIR: tools/ai-redteam-scanner/android

      - name: Regenerate the bundled scanner page from the Python corpus
        run: python3 tools/ai-redteam-scanner/gen_mobile.py

      - name: Verify the JS engine before packaging
        run: node tools/ai-redteam-scanner/tests/engine_js_test.js

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the debug APK
        working-directory: tools/ai-redteam-scanner/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build the release APK
        working-directory: tools/ai-redteam-scanner/android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts with friendly names
        run: |
          set -e
          mkdir -p out
          cp tools/ai-redteam-scanner/android/app/build/outputs/apk/debug/app-debug.apk \
             out/AIRT-Scanner-1.0.0-debug.apk
          cp tools/ai-redteam-scanner/android/app/build/outputs/apk/release/app-release.apk \
             out/AIRT-Scanner-1.0.0-release.apk
          ls -lh out
          unzip -l out/AIRT-Scanner-1.0.0-release.apk | grep -E "assets/index.html|AndroidManifest" || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: airt-scanner-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload build reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: airt-apk-build-logs
          path: |
            tools/ai-redteam-scanner/android/app/build/reports/**
            tools/ai-redteam-scanner/android/.gradle/**
          if-no-files-found: ignore
          retention-days: 7

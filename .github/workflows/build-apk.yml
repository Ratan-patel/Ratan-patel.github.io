name: Build Sentinel APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/959eea75-ratan-patel-github-io
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Sentinel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-APK
          path: Sentinel.apk
          if-no-files-found: error

      - name: Commit APK back to the repo
        run: |
          mkdir -p releases
          cp Sentinel.apk releases/Sentinel.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/Sentinel.apk
          git commit -m "Build Sentinel.apk from Android workflow [skip ci]" || echo "APK unchanged, nothing to commit"
          git push

name: Build Parrot 7.4 Minimal XFCE

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/build-parrot-lite.yml"
      - "parrot-7.4-lite/**"

permissions:
  contents: read

concurrency:
  group: parrot-7.4-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    name: Build bootable ISO (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo 'Before cleanup:'; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo 'After cleanup:'; df -h / | tail -1

      - name: Install ISO build dependencies
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends debian-archive-keyring
            echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie main' \
              | sudo tee /etc/apt/sources.list.d/debian-trixie.list
            printf 'Package: *\nPin: release n=trixie\nPin-Priority: 100\n\nPackage: live-build\nPin: release n=trixie\nPin-Priority: 1001\n' \
              | sudo tee /etc/apt/preferences.d/parrot-live-build
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends live-build/trixie \
              debootstrap squashfs-tools xorriso rsync apt-utils \
              gnupg dctrl-tools curl wget git cpio mtools dosfstools \
              grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common
            live_build_version="$(dpkg-query -W -f='${Version}' live-build)"
            echo "Using live-build $live_build_version"
            dpkg --compare-versions "$live_build_version" ge "1:20151215"
            sudo mkdir -p /usr/share/live/build/data/debian-cd
            sudo ln -sfn sid /usr/share/live/build/data/debian-cd/echo
            sudo ln -sfn sid /usr/share/debootstrap/scripts/echo
            parrot_key_source="$RUNNER_TEMP/parrotsec.gpg"
            parrot_keyring="$RUNNER_TEMP/parrot-archive-keyring.gpg"
            parrot_key_home="$RUNNER_TEMP/parrot-key-home"
            parrot_fingerprint='B711822346552E4D92DA02DF7A8286AF0E81EE4A'
            install -d -m 0700 "$parrot_key_home"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --silent --show-error \
              https://deb.parrot.sh/parrot/misc/parrotsec.gpg -o "$parrot_key_source"
            gpg --homedir "$parrot_key_home" --batch --import "$parrot_key_source"
            if ! gpg --homedir "$parrot_key_home" --batch --with-colons --list-keys \
              | awk -F: -v expected="$parrot_fingerprint" \
                  '$1 == "fpr" && toupper($10) == expected { found = 1 } END { exit found ? 0 : 1 }'; then
              echo 'Downloaded Parrot archive key has an unexpected fingerprint.' >&2
              exit 1
            fi
            gpg --homedir "$parrot_key_home" --batch --export "$parrot_fingerprint" > "$parrot_keyring"
            sudo install -m 0644 "$parrot_keyring" /usr/share/keyrings/parrot-archive-keyring.gpg
            rm -rf "$parrot_key_home" "$parrot_key_source" "$parrot_keyring"
          } 2>&1 | tee "$RUNNER_TEMP/parrot-iso-deps.log"

      - name: Build and verify ISO
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          set -o pipefail
          sudo -E env PATH="$PATH" OUTPUT_DIR="$RUNNER_TEMP/parrot-iso" \
            PARROT_VERSION=7.4 PARROT_SUITE=echo PARROT_ARCH=amd64 \
            bash parrot-7.4-lite/scripts/build-iso.sh 2>&1 \
            | tee "$RUNNER_TEMP/parrot-iso-build.log"
          ls -lh "$RUNNER_TEMP/parrot-iso"
          df -h / | tail -1

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Parrot-7.4-Minimal-XFCE-ISO-amd64
          path: ${{ runner.temp }}/parrot-iso/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: ISO build diagnostics
        if: always()
        run: |
          log="$RUNNER_TEMP/parrot-iso-build.log"
          [ -s "$log" ] || log="$RUNNER_TEMP/parrot-iso-deps.log"
          {
            echo '### ISO build diagnostics'
            echo ''
            if [ -s "$log" ]; then
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            else
              echo 'No ISO build or dependency log was created.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ISO failure annotations
        if: failure()
        run: |
          log="$RUNNER_TEMP/parrot-iso-build.log"
          [ -s "$log" ] || log="$RUNNER_TEMP/parrot-iso-deps.log"
          if [ -s "$log" ]; then
            detail="$(tail -n 30 "$log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            printf '::error title=ISO build log::%s\n' "$detail"
          fi

  qcow2:
    name: Build preinstalled QCOW2 (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo 'Before cleanup:'; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo 'After cleanup:'; df -h / | tail -1

      - name: Install QCOW2 build dependencies
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              qemu-utils qemu-system-x86 libguestfs-tools xz-utils curl gnupg \
              linux-image-virtual libvirt-daemon-system libvirt-clients \
              libvirt-daemon-driver-qemu libvirt-daemon-config-network
            sudo systemctl start libvirtd
            if ! sudo virsh net-info default >/dev/null 2>&1; then
              sudo virsh net-define /usr/share/libvirt/networks/default.xml
            fi
            sudo virsh net-autostart default
            if ! sudo virsh net-info default | grep -q 'Active:.*yes'; then
              sudo virsh net-start default
            fi
            sudo virsh net-info default
            for kernel in /boot/vmlinuz-* /boot/initrd.img-*; do
              [ -e "$kernel" ] && sudo chmod a+r "$kernel"
            done
            echo 'LIBGUESTFS_BACKEND=libvirt' >> "$GITHUB_ENV"
            echo 'LIBGUESTFS_BACKEND_SETTINGS=force_tcg:network_bridge=virbr0' >> "$GITHUB_ENV"
            echo 'LIBGUESTFS_MEMSIZE=4096' >> "$GITHUB_ENV"
            echo 'Using the system libvirt NAT network on virbr0.'
            df -h / | tail -1
          } 2>&1 | tee "$RUNNER_TEMP/parrot-qcow2-deps.log"

      - name: Customize, verify and compress QCOW2
        run: |
          set -o pipefail
          sudo -E env PATH="$PATH" \
            LIBGUESTFS_BACKEND=libvirt \
            LIBGUESTFS_BACKEND_SETTINGS=force_tcg:network_bridge=virbr0 \
            LIBGUESTFS_MEMSIZE=4096 LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1 \
            OUTPUT_DIR="$RUNNER_TEMP/parrot-qcow2" \
            WORK_DIR="$RUNNER_TEMP/parrot-qcow2-work" \
            PARROT_VERSION=7.4 PARROT_ARCH=amd64 PARROT_SOURCE_EDITION=security \
            bash -x parrot-7.4-lite/scripts/build-qcow2.sh 2>&1 \
            | tee "$RUNNER_TEMP/parrot-qcow2-build.log"
          ls -lh "$RUNNER_TEMP/parrot-qcow2"
          df -h / | tail -1

      - name: Upload QCOW2 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Parrot-7.4-Minimal-XFCE-QCOW2-amd64
          path: ${{ runner.temp }}/parrot-qcow2/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: QCOW2 build diagnostics
        if: always()
        run: |
          log="$RUNNER_TEMP/parrot-qcow2-build.log"
          [ -s "$log" ] || log="$RUNNER_TEMP/parrot-qcow2-deps.log"
          {
            echo '### QCOW2 build diagnostics'
            echo ''
            if [ -s "$log" ]; then
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            else
              echo 'No QCOW2 build or dependency log was created.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: QCOW2 failure annotations
        if: failure()
        run: |
          log="$RUNNER_TEMP/parrot-qcow2-build.log"
          [ -s "$log" ] || log="$RUNNER_TEMP/parrot-qcow2-deps.log"
          if [ -s "$log" ]; then
            detail="$(tail -n 80 "$log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            printf '::error title=QCOW2 build log::%s\n' "$detail"
          fi

      - name: Upload QCOW2 failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Parrot-7.4-QCOW2-diagnostics
          path: |
            ${{ runner.temp }}/parrot-qcow2-build.log
            ${{ runner.temp }}/parrot-qcow2-deps.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

html[data-accent="lime"]{--neon:#9dff4d;--neon2:#00e08a;--acc:#ff3bd0;--line:rgba(157,255,77,.16);--line2:rgba(157,255,77,.34)}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);line-height:1.55;overflow-x:hidden;

/* ---------- ambient layers ---------- */
.layer{position:fixed;inset:0;pointer-events:none}
#stars{z-index:0}
#three{z-index:1;opacity:.8;transition:opacity .2s linear}
#matrix{z-index:1;opacity:.13;transition:opacity .2s linear}
.grid-bg{z-index:0;background-image:linear-gradient(rgba(0,255,208,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,208,.045) 1px,transparent 1px);
  background-size:46px 46px;mask-image:radial-gradient(ellipse at 50% 10%,#000 15%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 10%,#000 15%,transparent 75%)}
.scanoverlay{z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.35;mix-blend-mode:multiply}
.vign{z-index:2;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}

.orb.b{width:560px;height:560px;background:var(--neon2);opacity:.13;bottom:-180px;right:-140px;animation-delay:-7s}
.orb.c{width:360px;height:360px;background:var(--acc);opacity:.1;top:45%;left:48%;animation-delay:-3s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(46px,-46px) scale(1.08)}}
html.perf-low .orb,html.perf-low .scanoverlay,html.perf-low #matrix{display:none}

/* ---------- cursor ---------- */
#cur,#curd{position:fixed;top:0;left:0;z-index:9999;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:difference}
#cur{width:7px;height:7px;background:var(--neon);transition:width .18s,height .18s}
#curd{width:32px;height:32px;border:1px solid var(--line2);transition:transform .1s ease-out,width .2s,height .2s,border-color .2s}

#curd.big{width:58px;height:58px;border-color:var(--neon)}
@media(hover:none),(max-width:899px){#cur,#curd{display:none}}

/* ---------- preloader ---------- */
#pre{position:fixed;inset:0;z-index:3000;background:#02050a;display:flex;flex-direction.£olumn;align-items:center;

/* ---------- top bars ---------- */
#scrollbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:110;background:linear-gradient(90deg,var(--neon),var(--neon2),var(--acc));box-shadow:0 0 14px var(--neon)}
nav{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);

.nav-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-family:var(--disp);font-weight:900;font-size:1.05rem;letter-spacing:1px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.85rem;color:#021;
  background:linear-gradient(140deg,var(--neon),var(--neon2));box-shadow:0 0 18px rgba(0,255,208,.d)}
.logo .txt{background:linear-gradient(90deg,var(--hi),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}

.nav-links a{color:var(--mut);padding:8px 11px;border-radius:8px;pcsition:relative;transition:.20s;white-space:nowrap}

.itool{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);border-radius:12px;padding:16px;transition:.3s;margin-bottom:12px}
.clink:hover{border-color:var(--neon);transform:translateX(6px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.clink .ico{width:44px;height:44px;margin:0;font-size:1.1rem;border-radius:12px}
.clink .lbl{font-family:var(--mono);font-size:.6rem;color:var(--mut);letter-spacing:1.4px}

.form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(10px)}
.form .f{margin-bottom:14px}
.form label{font-family:var(--mono);font-size:.64rem;color:var(--neon);letter-spacing:1.4px;display:block;margin-bottom:6px}
.form input,.form textarea,.form select{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:10px;
  padding:10px 15px;display:flex;align-items:center;gap:9px;transition:.3s;position:relative;overflow:hidden;cursor:pointer}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(_0deg,transparent,rgba(255,255,255,.22),transparent);transition:.6s}
.btn:hover::after{left:130%}
.btn.primary{background:linear-gradient(96deg,var(--neon),var(--neon2));color:#021b18;font-weight:700;border:none;box-shadow:0 0 26px rgba(0,255,208,.32)}
.btn.primary:hover{box-shadow:0 0 46px rgba(0,255,208,.55);transform:translateY(-3px)}
.btn.ghost{background:rgba(255,43,109,.06);color:var(--acc);border-color:rgba(255,43,109,.34)}
.btn.ghost:hover{background:rgba(255,43,109,.15);transform:translateY(-3px)}
.btn.out{color:var(--txt)}
.btn.out:hover{border-color:var(--neon);color:var(--neon);transform:translateY(-3px)}
.btn.sm{padding:9px 15px;font-size:.72rem}

/* ---------- hero ---------- */
#home{min-height:100vh;display:flex;align-items:center;padding=top:86px;padding-bottom:30px}
.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:42px;align-items:center;width:100%}

.hero-name{font-family:var(--disp);font-weight:900;font-size:clamp(2.3rem,5.6vw,4.15rem);line-height:1;

"html.light .hero-name{background:linear-gradient(12c2eg,#0a1420,var(--neon) 70%,var(--neon2));-webkit-background-clip:text;background-clip:text}
.hero-role{font-family:var(--mono);font-size:clamp(.95rem,2.2vw,1.22rem);color:var(--neon2);margin:10px 0 16px;min-height:1.7em}
.hero-role .cur{color:var(--neon);animation:blink 1s step-end infinite}
.mission{border-left:2px solid var(--neon);background:var(--panel);padding:13px 18px;border-radius:0 14px 14px 0;
  max-width:540px;margin-bottom:18px;backdrop-filter:blur(8px);font-style:italic;color:var(--txt);font-size:.98rem}
.mission .lbl{font-family:var(--mono);font-style:normal;color:var(--neon);font-size:.66rem;letter-spacing:1.6px;display:block;margin-bottom:7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;max-width:560px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center;
  backdrop-filter:blur(8px);transition:.3s}
.stat:hover{transform:translateY(-6px);border-color:var(--neon);box-shadow:0 14px 40px rgba(0,255,208,.14)}
.stat .n{font-family:var(--disp);font-weight:900;font-size:clamp(1.1rem,2.6vw,1.6rem);color:var(--neon);line-height:1}
.stat .l{font-family:var(--mono);font-size:.56rem;color:var(--mut);letter-spacing:1px;margin-top:6px}

/* profile hud card */
.pcard-wrap{perspective:1300px}
.pcard{position:relative;border-radius:24px;padding:1px;transform-style:preserve-3d;transition:transform .18s ease-out;
  background:conic-gradient(from var(--ang,0deg),var(--neon),transparent 25%,var(--neon2) 50%,transparent 75%,var(--neon));
  animation:angspin 7s linear infinite}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes angspin{to{--ang:360deg}}
.pcard-in{background:linear-gradient(162deg,#0a1526,#04080f);border-radius:23px;padding:20px;position:relative;overflow:hidden}
html.light .pcard-in{background:linear-gradient(162deg,#fff,#e7eef5)}
.pimg{position:relative;border-radius:16px;max-height:44vh;overflow:hidden;border:1px solid var(--line2);aspect-ratio:1/1;box-shadow:0 0 44px rgba(0,255,208,.18)}
.pimg img{width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(1.05)}
.pimg .scan{position:absolute;left:0;right:0;height:70px;background:linear-gradient(180deg,transparent,rgba(0,255,208,.3),transparent);animation:scan 3.6s linear infinite}
@keyframes scan{0%{top:-70px}100%{top:100%}}
.pimg .corner{position:absolute;width:22px;height:22px;border:2px solid var(--neon);opacity:.8}
.pimg .c1{top:8px;left:8px;border-right:0;border-bottom:0}
.pimg .c2{top:8px;right:8px;border-left:0;border-bottom:0}
.pimg .c3{bottom:8px;left:8px;border-right:0;border-top:0}

.hud-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));width:0;transition:width 1.4s ease}

/* marquee */
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:rgba(0,255,208,.03);padding:13px 0;position:relative;z-index:5;white-space:nowrap}

  font-size:1.05rem;color:transparent;-webkit-text-stroke:1px var(--line2)}
.marquee .track span i{color:var(--neon);-webkit-text-stroke:0;margin-right:10px;font-size:.9rem}
@keyframes scrollx{to{transform:translateX(-50%)}}
.marquee.rev .track{animation-direction:reverse}

.soc{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}

.kpi .sp{font-family:var(--mono);font-size:.58rem;color:var(--neon2)}

/* ---------- skills ---------- */
.skill-wrap{display:grid;grid-template-columns:.95fr 1.05fr;gap:26px;align-items:start}
#radar{width:100%;max-width:460px;aspect-ratio:1/1;height:auto;margin:0 auto;display:block}
.bars{display:grid;gap:13px}
.bar-row .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.76rem;margin-bottom:5Úx}
.bar-row .top b{color:var(--hi);font-weight:400}
.bar-row .top span{color:var(--neon)}
.bar-t{height:7px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;position:relative}
.bar-t>i{display:block;height:100%;width:0;bar-iredirects:padding:0 4px;border-radius:6px;background:linear-gradient(90deg,var(--neon2),var(--neon));
  box-shadow:0 0 12px rgba(0,255,208,.5);transition:width 1.5s cubic-bezier(.2,.8,.2,1)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22`x}
.fbtn{font-family:var(--mono);font-size:.7rem;padding:8px 15px;border-radius:22px;border:1px solid var(--line);
  background:rgba(0,255,208,.04);color:var(--mut);cursor:pointer;transition:.25s}
.fbtn:hover{color:var(--neon);border-color:var(--neon)}
.fbtn.on{background:linear-gradient(96deg,var(--neon),var(--neon2));color:#021b18;font-weight:700;border-color:transparent}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:11px;
  align-items:center;transition:.3s;font-size:.86rem}
.tool:hover{border-color:var(--neon);transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tool i{color:var(--neon2);font-size:1.05rem;width:20px;text-align:centerx}
.tool small{display:block;font-family:var(--mono);font-size:.56rem;color:var(--mut);letter-spacing:.8px}
.tool.hide{display:none}

/* ---------- lab / terminal ---------- */
.lab{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:start}
.term{background:#01050a;border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.65),0 0 46px rgba(0,255,208,.07)}
html.light .term{background:#071018}
.term-bar{background:linear-gradient(90deg,rgba(10,20,36,.9),rgba(6,12,22,.9));padding:10px 15px;display:flex;align-items:center;gap:9px;
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.72rem;color:var(--mut)}
.tdot{width:11px;height:11px;border-radius:50%}
.tdot.r{background:#ff5f57}.tdot.y{background:#febc2e}.tdot.g{background:#28c840}
.term-body{padding:16px;font-family:var(--mono);font-size:.8rem;height:330px;overflow-y:auto;line-height:1.72;color:#9fe8dc}
html.light .term-body{color:#9fe8dc}
.term-body .ok{color:var(--neon)}.term-body .b2{color:var(--neon2)}.term-body .am{color:var(--amber)}
.term-body .er{color:var(--acc)}.term-body .mut{color:#5b7285}.term-body .hi{color:#fff}
.term-body table{border-collapse:collapse;font-size:.74rem;margin:4px 0}
.term-body td{padding:1px 12px 1px 0}
.term-in{display:flex;align-items:center;padding:11px 16px;border-top:1px solid var(--line);background:#020609;font-family:var(--mono)}
.term-in span{color:var(--neon);margin-right:8px;font-size:.8rem;white-space:nowrap}
.term-in input{flex:1;background:none;border:none;outline:none;font-size:.8rem;color:#cff}
.qcmd{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.qcmd button{font-family:var(--mono);font-size:.68rem;background:rgba(0,255,208,.06);border:1px solid var(--line);
  color:var(--neon);padding:7px 13px;border-radius:8px;cursor:pointer;transition:.22s}
.qcmd button:hover{background:var(--neon);color:#021;transform:translateY(-2px)}
.ctf{display:grid;gap:12px}
.ch{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;transition:.3s}
.ch.solved{border-color:var(--neon);background:rgba(0,255,208,.07)}
.ch .h{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:.7rem;color:var(--neon);letter-spacing:1px}
.ch .h .pts{margin-left:auto;color:var(--amber)}
.ch p{font-size:.85rem;color:var(--txt);margin:9px 0}
.ch code{font-family:var(--mono);background:rgba(0,255,208,.09);color:var(--neon);padding:2px 6px;border-radius:5px;font-size:.8rem;word-break:break-all}
.ch .row{display:flex;gap:8px}
.ch input{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  font-family:var(--mono);font-size:.74rem;outline:none}
.ch input:focus{border-color:var(--neon)}
.ch .msg{font-family:var(--mono);font-size:.66rem;margin-top:7px;min-height:1em}
.score{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line2);
  border-radius:13px;padding:14px 16px;font-family:var(--mono);font-size:.74rem}
.score .big{font-family:var(--disp);font-weight:900;font-size:1.5rem;color:var(--neon)}
.badges{display:flex;gap:a60x;margin-left:auto;color:var(--neon);transition:.3s}
.acc-i.open .acc-h .ch{transform:rotate(180deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.2,.8,.2,1)}
.acc-b p{padding:0 16px 15px;font-size:.9rem;color:var(--mut)}

/* ---------- platforms ---------- */
.plat{display:flex;flex;align-items:center;gap:12px;border-radius:13px;padding:16px;transition:.3s;margin-bottom:12px}
.clink:hover{border-color:var(--neon);transform:translateX(6px);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.clink .ico{width:44px;height:44px;margin:0;font-size:1.1rem;border-radius:12px}
.clink .lbl{font-family:var(--mono);font-size:.6rem;color:var(--mut);letter-spacing:1.4px}
.clink .v{color:var(--hi);font-size:.98rem}

(()=>{
  const roles=['Certified Ethical Hacker Â· CEH v12','Red Team Operator & Adversary Emulator','Corporate Cybersecurity Trainer','VAPT & OWASP Specialist','AI / LLM Security Researcher','Bug Bounty Hunter Â½ Synack Â· HackerOne'];
  const el=$('#typed');let r=0,i=0,del=false;
  (function tick(){
    const s=roles[r];
    el.textContent=del?s.slice(0,--i):s.slice(0,++i);
    if(!del&&i===s.length){del=true;return setTimeout(tick,1500)}
    if(del&&i===0){del=false;r=(r+1)%roles.length;return setTimeout(tick,260)}
    setTimeout(tick,del?32:62);
  })();
})();
